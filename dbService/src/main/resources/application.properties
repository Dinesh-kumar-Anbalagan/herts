spring.application.name=Database

# === PostgreSQL Connection ===
spring.datasource.url=jdbc:postgresql://localhost:5432/UK_SHIPMENT?currentSchema=herts_shipment
spring.datasource.username=postgres
spring.datasource.password=Mea@1837
spring.datasource.driver-class-name=org.postgresql.Driver

# === JPA ===
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# === MyBatis ===
mybatis.mapper-locations=classpath:mapper/*.xml
logging.level.org.mybatis=DEBUG
logging.level.jdbc.sqlonly=DEBUG

# === Flyway ===
flyway.enabled=true
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=true
spring.datasource.embedded-database-connection=none

# === Server ===
server.port=8085
